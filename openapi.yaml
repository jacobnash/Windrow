openapi: 3.1.0
info:
  title: Windrow BACnet & Modbus Discovery, Connections & Devices API
  version: "1.1.0"
  description: |
    The "SkySpark-easy, but via API" surface: discover BACnet devices,
    learn what points are on one, then create a connection with the
    points you picked - no hand-typed BACnet object identifiers anywhere
    in the flow. See `docs/bacnet-discovery-api.md` for the full
    discover → learn → create-connection recipe with a worked example.

    Modbus has no discovery protocol of its own, so `/modbus/discover`
    sweeps a user-supplied CIDR on port 502 instead of broadcasting -
    see `/modbus/discover`'s own description. `/devices` is a periodic-scan
    result registry, separate from `/connections` and `/modbus/connections`:
    it tracks every device either kind of scan has ever seen, whether or
    not a human has provisioned a connection for it yet, plus an optional
    per-device credential and a best-effort flag for devices still on a
    factory-default login (see `/devices/{id}/recheck-credentials`).

    This document is served live by the API itself at `GET /openapi.yaml`
    - it is read straight off disk by the same process handling every
    other route, not maintained as a separate promise about the code.
servers:
  - url: http://localhost:8001
    description: Local dev default (see `python -m windrow.api --help`)
paths:
  /discover:
    post:
      operationId: discoverDevices
      summary: Find BACnet devices (Who-Is / I-Am)
      description: |
        Broadcasts Who-Is globally (`*:*`) by default: every BACnet router
        forwards it to the networks behind it (MS/TP trunks included), and
        when Windrow is a foreign device (`--foreign` /
        `WINDROW_BACNET_FOREIGN_BBMD`) its BBMD distributes it to the other
        subnets. A device behind a router answers from a routed `net:mac`
        address (e.g. `5:12`), which is what a connection to it uses.
        Pass `network` to broadcast on one remote network only,
        `global_broadcast: false` to stay on this subnet, or `address` to
        target one specific device (a directed Who-Is) - useful for testing
        on a single host, since a locally-originated broadcast doesn't loop
        back to another process on the *same* machine over a real physical
        interface (a macOS/BSD networking behavior, not something this
        endpoint works around).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverRequest"
            examples:
              broadcast:
                summary: Scan the whole local network
                value: {}
              directed:
                summary: Target one known device (e.g. for same-host testing)
                value: { "address": "192.168.128.63:47808", "timeout": 5.0 }
              one_network:
                summary: Every device on network 5 (e.g. one MS/TP trunk)
                value: { "network": 5 }
      responses:
        "200":
          description: Every device that responded, as a JSON array (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
              example:
                - { "device_instance": 3456, "address": "192.168.128.63", "network": null, "mac": "192.168.128.63", "vendor_id": 999, "max_apdu": 1476 }
                - { "device_instance": 4242, "address": "5:12", "network": 5, "mac": "12", "vendor_id": 24, "max_apdu": 480 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /discover/routers:
    post:
      operationId: discoverRouters
      summary: Find BACnet routers (Who-Is-Router-To-Network)
      description: >-
        Asks every router reachable from here (through the BBMD too, as a
        foreign device) which networks it reaches. The network numbers are
        what `POST /discover`'s `network` and a `net:mac` device address
        refer to. The routes learned are also cached (see GET /bacnet/network).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: integer
                  minimum: 1
                  maximum: 65534
                  description: Only routers to this network.
                timeout:
                  type: number
                  default: 5.0
      responses:
        "200":
          description: Each router that answered and the networks it reaches.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [address, networks]
                  properties:
                    address: { type: string, example: "10.0.0.1" }
                    networks: { type: array, items: { type: integer }, example: [5, 6] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /bacnet/network:
    get:
      operationId: getBacnetNetwork
      summary: How this instance is attached to BACnet - BBMD / foreign-device state and known routes
      description: >-
        `mode` is `normal`, `foreign` (registered with a BBMD: set with
        `--foreign`/`--ttl` or `WINDROW_BACNET_FOREIGN_BBMD`/`WINDROW_BACNET_FOREIGN_TTL`;
        the registration renews itself at the TTL) or `bbmd` (`--bbmd` or
        `WINDROW_BACNET_BBMD_BDT`). `registration` is the BBMD's answer to the
        last registration: `registered`, `registering` (no answer yet),
        `unregistered`, or `rejected (code)`. `routes` are the routers learned
        so far, by network.
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema:
                type: object
                required: [mode, routes]
                properties:
                  mode: { type: string, enum: [normal, foreign, bbmd] }
                  bbmd: { type: ["string", "null"], example: "10.1.0.1" }
                  ttl: { type: ["integer", "null"], example: 300 }
                  registration: { type: string, example: registered }
                  bdt: { type: array, items: { type: string } }
                  foreign_devices:
                    type: array
                    items:
                      type: object
                      properties:
                        address: { type: string }
                        ttl: { type: integer }
                        remaining: { type: integer }
                  networks: { type: array, items: { type: integer } }
                  routes:
                    type: array
                    items:
                      type: object
                      properties:
                        network: { type: integer, example: 5 }
                        router: { type: string, example: "10.0.0.1" }
        "500":
          $ref: "#/components/responses/ServerError"
  /write:
    post:
      summary: Command a point (BACnet WriteProperty with priority, or a Modbus register/coil write)
      description: >-
        Writes present-value of the point that publishes `topic`, at a BACnet
        priority (1-16, or 17 = relinquish-default); `value: null`
        relinquishes that priority. Only commandable objects
        (analog/binary/multi-state output and value) are accepted. The
        read-back value is published to MQTT immediately. Same handler as
        the command channel's `point_write` action.


        If a Modbus connection publishes `topic`, the point must be
        `writable` (a holding register or coil). The value is in
        engineering units and is encoded with the point's type, order,
        scale and offset (rounded to the nearest step the register holds).
        Modbus devices have no priority array, so Windrow keeps one per
        point (the connection's `write_levels`) and writes the
        highest-priority level's value; relinquishing every level leaves
        the register at its last value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, priority]
              properties:
                topic: { type: string, example: "fbf/hospital-a/ahu-1/zone-sp" }
                value: { description: "Number, boolean/active/inactive, state number, or null to relinquish." }
                priority: { type: integer, minimum: 1, maximum: 17 }
                expires_at: { type: number, description: "Unix seconds; refused if already past." }
      responses:
        "200":
          description: >-
            Written; includes the read-back present value. `present_value` is
            null when the write succeeded but the read-back didn't (the next
            poll reports it).
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic: { type: string }
                  priority: { type: integer }
                  value: {}
                  present_value: {}
                  effective_level:
                    type: [integer, "null"]
                    description: Modbus only - the level whose value is now on the device, or null if every level is relinquished.
        "400":
          description: >-
            Unknown point, not commandable/writable, bad priority/value,
            expired, the Modbus device isn't connected or refused the write,
            or the BACnet device refused it (the error says why, e.g.
            `property: write-access-denied`).
        "502":
          description: The device answered with an error the handler didn't expect (any endpoint can return this).
        "504":
          description: The device didn't answer (WINDROW_WRITE_TIMEOUT, default 10 s, for a BACnet write).
  /schedules:
    post:
      operationId: readSchedules
      summary: Read a device's Schedule and Calendar objects (as-built schedule check)
      description: >-
        Reads every schedule and calendar object in the device's object-list
        now and returns them as JSON (Baler#165). An exception-schedule too big
        for one answer is read element by element. Same as the command
        channel's `read_schedules`; `GET /connections/{id}/schedules` does the
        same for a connection's device and names its points.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_address, device_instance]
              properties:
                device_address: { type: string, example: "192.168.128.63:47808" }
                device_instance: { type: integer, example: 3456 }
      responses:
        "200":
          description: The device's schedules and calendars.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSchedules"
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /learn:
    post:
      operationId: learnPoints
      summary: Enumerate a device's points
      description: |
        Reads the device's object list, then batch-reads
        object-name/present-value/units per object. Every object comes
        back, points included - a `null` `present_value` (e.g. on a
        network-port object) is a hint it's not a sensor/actuator point,
        not an error. `units: null` isn't a bug either: some objects
        genuinely have no `units` property, and one missing property
        never hides the rest of a point's fields or the other points on
        the device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnRequest"
            examples:
              default:
                value: { "device_address": "192.168.128.63:47808", "device_instance": 3456 }
      responses:
        "200":
          description: Every object on the device, as a JSON array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnedPoint"
              example:
                - { "object_identifier": "network-port,1", "label": "NetworkPort-1", "present_value": null, "units": null }
                - { "object_identifier": "analog-value,1", "label": "zone-temp", "present_value": 71.0, "units": "degrees-fahrenheit" }
                - { "object_identifier": "binary-value,1", "label": "fan-status", "present_value": "active", "units": null }
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /connections:
    post:
      operationId: createConnection
      summary: Create a connection and start polling it immediately
      description: |
        Pick whichever points `/learn` returned that you actually want
        bridged. `label` is just the MQTT topic segment (matches every
        other bridge's "point is whatever label makes sense" convention)
        - rename it freely, it doesn't have to match what `/learn`
        suggested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
            examples:
              default:
                value:
                  device_address: "192.168.128.63:47808"
                  device_instance: 3456
                  topic_prefix: "fbf/ahu-3"
                  poll_interval: 5.0
                  points:
                    - { "object_identifier": "analog-value,1", "label": "zone-temp" }
                    - { "object_identifier": "binary-value,1", "label": "fan-status" }
      responses:
        "201":
          description: Created. Polling has already started - publishes land on `{topic_prefix}/{label}` per point, on the frozen `{point, value, ts}` envelope every Windrow bridge uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listConnections
      summary: List every active connection
      responses:
        "200":
          description: Every connection currently persisted and polling, as a JSON array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "500":
          $ref: "#/components/responses/ServerError"
  /connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Stop and remove a connection
      description: Cancels the poll task and removes it from persisted state - a restarted `windrow.api` process will not resume it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 419dff013a6d4d7783b43e6603ccefd7
      responses:
        "204":
          description: Deleted. No response body.
        "404":
          description: No connection with that id.
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateConnection
      summary: Edit a connection's points, poll interval, topic prefix or read options
      description: >-
        Send any subset of `points`, `poll_interval`, `topic_prefix` and the
        read options (`read_multiple`, `read_multiple_max`, `subscribe_cov`,
        `cov_lifetime`, `cov_poll_interval`);
        anything else is a 400 (a typo'd field is refused, not ignored).
        `points` replaces the whole list, and each point keeps only the
        fields `PointRef` documents (so `/learn` output can be sent as-is;
        its `present_value` snapshot is dropped). The connection's poll
        tasks restart with the new settings, every point's tags and the
        `{topic_prefix}/equip/tags` record are republished, and each point
        that no longer publishes where it did - a removed label, or every
        point when `topic_prefix` changes - gets an empty retained message
        on `{old_prefix}/{label}` and `{old_prefix}/{label}/tags` (plus
        `{old_prefix}/equip/tags` on a prefix change), so its last value
        and tags stop being handed to new subscribers. The id is kept.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionRequest"
            examples:
              default:
                value:
                  poll_interval: 10.0
                  points:
                    - { "object_identifier": "analog-value,1", "label": "zone-temp" }
                    - { "object_identifier": "analog-value,3", "label": "zone-sp", "his_collect_cov": 0.5 }
      responses:
        "200":
          description: The updated connection, credential redacted. Polling has already restarted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No connection with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
  /connections/{id}/alarms:
    get:
      operationId: getConnectionAlarms
      summary: The connection's device's active alarms, read now (GetEventInformation)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Every object on the device not in a normal event state, or with a transition not yet acknowledged.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [object, event_state]
                  properties:
                    object: { type: string, example: "analog-value,1" }
                    event_state: { type: string, example: high-limit }
                    acked:
                      type: object
                      properties:
                        to_offnormal: { type: boolean }
                        to_fault: { type: boolean }
                        to_normal: { type: boolean }
                    notify_type: { type: string, example: alarm }
                    timestamps: { type: array, items: { type: ["string", "null"] } }
        "404":
          description: No connection with that id.
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /connections/{id}/schedules:
    get:
      operationId: getConnectionSchedules
      summary: The connection's device's schedules, with its points named in `controls`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: As POST /schedules; a schedule that writes one of this connection's points carries its `label`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSchedules"
        "404":
          description: No connection with that id.
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /connections/{id}/credential:
    patch:
      operationId: setConnectionCredential
      summary: Set (or replace) the login this connection's device needs
      description: >-
        Neither BACnet nor Modbus has protocol-level auth - this is purely
        bookkeeping for whatever manual login the physical device or its
        gateway needs (e.g. its own local web UI). Stored encrypted at
        rest. The response shows the plaintext password once, at set time
        only - every later `GET /connections` redacts it to `null`, same
        pattern as `/webhooks`'s `secret` in baler's fault API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCredentialRequest"
      responses:
        "200":
          description: Set. Password shown once, here only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "404":
          description: No connection with that id.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /modbus/discover:
    post:
      operationId: discoverModbusDevices
      summary: Sweep a subnet for Modbus/TCP devices
      description: >-
        Modbus has no discovery protocol - this TCP-connect-scans every
        host in `cidr` on `port` (bounded to `concurrency` simultaneous
        attempts) and, where the device implements it, best-effort reads
        its Basic Device Identification (Modbus function 0x2B/0x0E) for
        vendor/product/revision. A device that doesn't implement 0x2B/0x0E
        is still a real find - it comes back with those three fields
        `null`, not omitted from the results or treated as an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModbusDiscoverRequest"
            examples:
              default:
                value: { "cidr": "192.168.1.0/24" }
      responses:
        "200":
          description: Every host that accepted a Modbus TCP connection, as a JSON array (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModbusDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /modbus/test-read:
    post:
      operationId: modbusTestRead
      summary: Read one holding register from a device before connecting it
      description: >-
        Opens a fresh connection, reads `register` once and closes it again.
        Nothing is stored or published. A host that doesn't answer, or an
        exception code from the device, is a 400 with what went wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModbusTestReadRequest"
            examples:
              default:
                value: { "host": "192.168.1.50", "port": 502, "device_id": 1, "register": 0 }
      responses:
        "200":
          description: The register's value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModbusTestReadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/Timeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /modbus/connections:
    post:
      operationId: createModbusConnection
      summary: Create a Modbus connection and start polling it immediately
      description: >-
        Modbus has no self-describing object list the way BACnet does -
        register addresses are opaque and vendor-documented, so `points`
        is a `{label: point}` map you supply directly, not something a
        `/learn`-equivalent suggests - each point a bare holding-register
        address or a `ModbusPoint` object (function code, data type,
        word/byte order, scale/offset, unit, writable).
        Like a BACnet connection, it also publishes (retained) each point's
        Haystack tags on `{topic_prefix}/{label}/tags` - markers from the
        label's words, plus `unit` from `units` - and one
        `{topic_prefix}/equip/tags` naming its points, so Baler gives the
        connection an equipment record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModbusConnectionRequest"
            examples:
              default:
                value:
                  host: "192.168.1.50"
                  port: 502
                  topic_prefix: "fbf/modbus-ahu-1"
                  poll_interval: 5.0
                  points: { "zone-temp": 0, "fan-status": 1 }
      responses:
        "201":
          description: Created. Polling has already started - publishes land on `{topic_prefix}/{label}` per point, on the frozen `{point, value, ts}` envelope every Windrow bridge uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModbusConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listModbusConnections
      summary: List every active Modbus connection
      responses:
        "200":
          description: Every Modbus connection currently persisted and polling, as a JSON array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModbusConnection"
        "500":
          $ref: "#/components/responses/ServerError"
  /modbus/connections/{id}:
    delete:
      operationId: deleteModbusConnection
      summary: Stop and remove a Modbus connection
      description: Cancels the poll task and removes it from persisted state - a restarted `windrow.api` process will not resume it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted. No response body.
        "404":
          description: No connection with that id.
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateModbusConnection
      summary: Edit a Modbus connection
      description: >-
        Same shape and reasoning as `PATCH /connections/{id}`, with any
        subset of `points` (replaces the whole `{label: point}` map),
        `units`,
        `poll_interval`, `topic_prefix`, `host`, `port` and `device_id`.
        The poll task and its Modbus client are closed and reopened, so a
        new host/port takes effect at once. Modbus connections publish no
        tags of their own, but `{old_prefix}/{label}/tags` is cleared along
        with the value topic for each removed point anyway, in case a
        human tagged it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModbusConnectionRequest"
            examples:
              default:
                value: { "host": "192.168.1.51", "points": { "zone-temp": 0, "return-temp": 2 } }
      responses:
        "200":
          description: The updated connection, credential redacted. Polling has already restarted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModbusConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No connection with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
  /modbus/connections/{id}/credential:
    patch:
      operationId: setModbusConnectionCredential
      summary: Set (or replace) the login this Modbus connection's device needs
      description: Same shape and reasoning as `PATCH /connections/{id}/credential`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCredentialRequest"
      responses:
        "200":
          description: Set. Password shown once, here only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "404":
          description: No connection with that id.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /devices:
    get:
      operationId: listDevices
      summary: List every device either periodic scan has ever seen
      description: >-
        Populated by the periodic BACnet Who-Is scan (always running,
        interval set by `--bacnet-discovery-interval`) and, if configured,
        one or more periodic Modbus CIDR sweeps (`--modbus-scan-cidr`, off
        by default - no safe subnet to guess). `status` is `pending`
        (seen, no connection provisioned yet), `provisioned` (a matching
        connection exists), or `ignored` (a human dismissed it - survives
        rescans). `default_credential_flag` is always `null` for BACnet
        devices (no HTTP-login concept applies) and best-effort for Modbus
        devices (see `/devices/{id}/recheck-credentials`).
      responses:
        "200":
          description: Every known device, as a JSON array, credentials redacted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceRecord"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: addDevice
      summary: Add a device by address
      description: >-
        For a device a scan can't find - broadcasts filtered between
        subnets, or Modbus on a subnet no `--modbus-scan-cidr` covers.
        Creates the same record a scan would (keyed the same way, so a
        later scan that does hear the device updates this record rather
        than adding a second one), with status `pending` - or
        `provisioned` if a connection already polls that device. Adding a
        device that's already known returns its existing record with 200.
        A BACnet `device_address` on the standard port 47808 is stored
        without the port, the way discovery reports it; a non-standard
        port is kept. A new pending Modbus device gets the same one-time
        default-credential check a scanned one does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeviceRequest"
            examples:
              bacnet:
                value: { "protocol": "bacnet", "device_address": "10.0.0.5", "device_instance": 1234 }
              modbus:
                value: { "protocol": "modbus", "host": "10.0.0.6", "port": 502, "device_id": 1 }
      responses:
        "201":
          description: Added. The new device record, credentials redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecord"
        "200":
          description: Already known. The existing device record, unchanged, credentials redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /devices/{id}:
    patch:
      operationId: setDeviceStatus
      summary: Set a device's status (e.g. dismiss it as "ignored")
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, provisioned, ignored]
      responses:
        "200":
          description: Updated device record, credentials redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecord"
        "404":
          description: No device with that id.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /devices/{id}/credential:
    patch:
      operationId: setDeviceCredential
      summary: Set (or replace) the login a discovered-but-not-yet-provisioned device needs
      description: >-
        For a device that needs a credential recorded before any
        connection exists for it yet (e.g. a gateway's web login that
        will never be polled as a point). Same shape and reasoning as
        `PATCH /connections/{id}/credential`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCredentialRequest"
      responses:
        "200":
          description: Set. Password shown once, here only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "404":
          description: No device with that id.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /devices/{id}/recheck-credentials:
    post:
      operationId: recheckDeviceDefaultCredentials
      summary: Re-run the default-credential check against this device
      description: >-
        Automatically run once, the first time a Modbus device is seen as
        `pending` (never for BACnet - see `/devices`'s description). This
        lets a human re-trigger it later, e.g. after changing the
        device's password, to confirm `default_credential_flag` clears.
        A short hardcoded list of common defaults (admin/admin, etc.)
        tried as HTTP Basic Auth against the device's own address, GET
        only, non-destructive.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated device record, credentials redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecord"
        "404":
          description: No device with that id.
        "500":
          $ref: "#/components/responses/ServerError"
  /jobs:
    post:
      operationId: startJob
      summary: Start a slow action (discover, learn, Modbus sweep) in the background
      description: >-
        Answers at once with a job; poll `GET /jobs/{id}` for `progress` and,
        once `state` is `done`, the `result` (what the synchronous route
        would have returned). The synchronous routes give up after 15 s, so
        a /24 sweep or a big learn should use this. A finished `discover` or
        `modbus_discover` also records what it found as devices, like the
        periodic scans. A second start of a discover or sweep while one is
        running returns the running job. Jobs are in memory only: the newest
        20 are kept, none across a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartJobRequest"
            examples:
              sweep:
                value: { "job": "modbus_discover", "cidr": "192.168.1.0/24" }
              learn:
                value: { "job": "learn", "device_address": "192.168.1.20", "device_instance": 10228 }
      responses:
        "202":
          description: Started (or the same kind already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listJobs
      summary: Recent jobs, without their results
      responses:
        "200":
          description: Jobs, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      summary: One job's state, progress and (when done) result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: No job with that id (it was trimmed, or Windrow restarted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /status:
    get:
      operationId: getStatus
      summary: This node's status (the heartbeat's payload, over HTTP)
      responses:
        "200":
          description: Same fields as the retained cmd/<site>/<instance>/status heartbeat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStatus"
        "500":
          $ref: "#/components/responses/ServerError"
  /announced:
    get:
      operationId: listAnnounced
      summary: Devices that announced themselves ("I am here")
      description: >-
        Filled by `python -m windrow.announce` senders on the LAN, when this
        Windrow listens (`--announce-port`). A device's address is the
        datagram's source IP. `online` is false after 3 missed intervals.
        `history` lists address changes; connections whose `device_name`
        matches were re-pointed.
      responses:
        "200":
          description: Every device ever announced.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnouncedDevice"
        "500":
          $ref: "#/components/responses/ServerError"
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: This document
      description: Served raw, straight off disk - the same file you're reading right now.
      responses:
        "200":
          description: The OpenAPI 3.1 spec for this API, as YAML.
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    DiscoverRequest:
      type: object
      properties:
        low_limit:
          type: integer
          description: Lower bound of the device-instance range to scan. Requires high_limit.
        high_limit:
          type: integer
          description: Upper bound of the device-instance range to scan. Requires low_limit.
        address:
          type: string
          description: Target one specific device (directed Who-Is) instead of broadcasting - a local `ip[:port]` or a routed `net:mac`.
          example: "192.168.128.63:47808"
        network:
          type: integer
          minimum: 1
          maximum: 65534
          description: Broadcast on this one remote network (`net:*`) instead of globally.
        global_broadcast:
          type: boolean
          default: true
          description: "`false` keeps the Who-Is to this subnet (a local broadcast), as before Baler#126."
        timeout:
          type: number
          description: Seconds to wait for I-Am responses. Defaults to bacpypes3's own Who-Is timeout (3s) if omitted.
          example: 5.0
    Device:
      type: object
      required: [device_instance, address, vendor_id]
      properties:
        device_instance:
          type: integer
          example: 3456
        address:
          type: string
          description: >-
            The address the device responded from, as every other call takes
            it: a BACnet/IP address (no port when it's the standard 47808), or
            for a device behind a router `net:mac` - its network number and
            its MAC on that network (`5:12` for MS/TP MAC 12 on network 5,
            `7:10.0.1.20` for a BACnet/IP device on a routed IP network).
          example: "192.168.128.63"
        network:
          type: ["integer", "null"]
          description: The device's network number when it's behind a router; null on this subnet.
        mac:
          type: string
          description: The device's MAC on its network (the IP address on this subnet).
        vendor_id:
          type: integer
          example: 999
        max_apdu:
          type: integer
          description: Largest APDU the device accepts, from its I-Am (480 is typical of MS/TP).
    LearnRequest:
      type: object
      required: [device_address, device_instance]
      properties:
        device_address:
          type: string
          example: "192.168.128.63:47808"
        device_instance:
          type: integer
          example: 3456
    LearnedPoint:
      type: object
      required: [object_identifier, label]
      properties:
        object_identifier:
          type: string
          description: The real BACnet object identifier - what create-a-connection needs, not a display name.
          example: "analog-value,1"
        label:
          type: string
          description: object-name if the device reports one, otherwise falls back to the object_identifier itself.
          example: zone-temp
        present_value:
          description: Current value at learn time - a snapshot, not a live feed. null if the object has none (e.g. a network-port) or the property read failed.
          oneOf: [{ type: number }, { type: string }, { type: boolean }, { type: "null" }]
          example: 71.0
        units:
          type: ["string", "null"]
          example: degrees-fahrenheit
        object_type:
          type: string
          description: The BACnet object type, on its own (Windrow#19). Raw evidence for classifying a badly named point.
          example: analog-value
        commandable:
          type: boolean
          description: >-
            The object has a priority array (read as relinquish-default, which
            the standard requires exactly when there is one). Only for the
            types that can be commandable: outputs and values.
        state_text:
          type: array
          items: { type: string }
          description: A multi-state object's state-text, as the device gives it.
          example: ["Off", "Low", "High"]
        active_text:
          type: string
          description: A binary object's active-text.
        inactive_text:
          type: string
          description: A binary object's inactive-text.
        min_pres_value:
          type: number
        max_pres_value:
          type: number
        cov_increment:
          type: number
        structured_views:
          type: array
          items: { type: string }
          description: Names of the device's structured-view objects whose subordinate-list includes this point - the integrator's equipment grouping, when they built one. Structured views themselves aren't listed as points.
          example: ["AHU-1"]
        device:
          $ref: "#/components/schemas/LearnedDevice"
    LearnedDevice:
      type: object
      description: >-
        The device object's identity, read once per learn, best effort: only
        what the device answered (Windrow#19).
      properties:
        instance: { type: integer, example: 3456 }
        name: { type: string, description: The device's object-name. }
        vendor_name: { type: string }
        model_name: { type: string }
        location: { type: string }
    PointRef:
      type: object
      required: [object_identifier, label]
      properties:
        object_identifier:
          type: string
          example: "analog-value,1"
        label:
          type: string
          description: MQTT topic segment for this point - freely renameable from what /learn suggested.
          example: zone-temp
        units:
          type: ["string", "null"]
          description: The BACnet units /learn reported for this point (pass it through). Published as the point's Haystack `unit` tag.
          example: degrees-fahrenheit
        description:
          type: ["string", "null"]
          description: The description /learn reported. Its words help tag the point (rules/bacnet_to_haystack_tags.yaml).
        unit:
          type: string
          description: An explicit Haystack unit symbol for the point's `unit` tag, overriding `units` - for a device that reports none or the wrong one.
          example: "°F"
        object_type:
          $ref: "#/components/schemas/LearnedPoint/properties/object_type"
        commandable:
          $ref: "#/components/schemas/LearnedPoint/properties/commandable"
        state_text:
          $ref: "#/components/schemas/LearnedPoint/properties/state_text"
        active_text:
          $ref: "#/components/schemas/LearnedPoint/properties/active_text"
        inactive_text:
          $ref: "#/components/schemas/LearnedPoint/properties/inactive_text"
        min_pres_value:
          $ref: "#/components/schemas/LearnedPoint/properties/min_pres_value"
        max_pres_value:
          $ref: "#/components/schemas/LearnedPoint/properties/max_pres_value"
        cov_increment:
          $ref: "#/components/schemas/LearnedPoint/properties/cov_increment"
        structured_views:
          $ref: "#/components/schemas/LearnedPoint/properties/structured_views"
        device:
          $ref: "#/components/schemas/LearnedPoint/properties/device"
        poll_interval:
          type: number
          description: Seconds between reads of this specific point, overriding the connection-level default. Each point runs its own independent poll loop - a fast-changing point and a slow one on the same device don't have to share a cadence.
          example: 1.0
        his_collect_cov:
          description: >-
            Enables change-of-value filtering for this point, matching
            Haystack's own `hisCollectCov` semantics: `true` publishes on
            any change; a number is a numeric tolerance the value must
            move by before it's published (non-numeric values always
            compare by equality regardless). Omit to publish every poll
            unconditionally (the default).
          oneOf: [{ type: boolean }, { type: number }]
          example: 0.5
        his_collect_cov_rate_limit:
          type: number
          description: Never publish COV-triggered changes faster than this many seconds apart, even if the value keeps changing. Only meaningful alongside his_collect_cov.
          example: 5.0
        his_collect_interval:
          type: number
          description: Alternative to his_collect_cov - publish at most this often regardless of whether the value changed, independent of poll_interval (matches Haystack's hisCollectInterval).
          example: 300.0
        subscribe_cov:
          type: boolean
          description: >-
            Overrides the connection's `subscribe_cov` for this point - e.g.
            `false` for a point whose device floods notifications. (Not
            the same thing as `his_collect_cov`, which filters what gets
            published, however the value arrived.)
        trend_log:
          type: string
          description: >-
            The controller's TrendLog object that logs this point (e.g.
            `trend-log,3`). After Windrow was down, or couldn't reach the
            device, the readings it missed are read back from that log with
            ReadRange and published on the point's topic with their own
            timestamps, not retained (so the live value stays the retained
            one). Goes back at most the connection's `backfill_window`.
          example: "trend-log,3"
    TimeValue:
      type: object
      properties:
        time: { type: string, example: "07:00:00" }
        value: { description: "What the schedule writes then: a number, active/inactive for a binary target, or null (relinquish)." }
    SchedulePeriod:
      type: object
      description: "One of: `date` (YYYY-MM-DD, `*` for any field), `date_range` [start, end], `week_n_day` {month, week, weekday} (null = any), or `calendar` (a calendar object id)."
      properties:
        date: { type: string, example: "*-12-25" }
        date_range: { type: array, items: { type: string } }
        week_n_day:
          type: object
          properties:
            month: { type: ["integer", "null"] }
            week: { type: ["integer", "null"], description: "1-5 = days 1-7, 8-14, ...; 6 = the last 7 days" }
            weekday: { type: ["string", "null"], example: thursday }
        calendar: { type: string, example: "calendar,1" }
    DeviceSchedules:
      type: object
      required: [schedules, calendars]
      properties:
        schedules:
          type: array
          items:
            type: object
            properties:
              object: { type: string, example: "schedule,1" }
              name: { type: ["string", "null"] }
              present_value: {}
              default: {}
              priority_for_writing: { type: ["integer", "null"] }
              effective_period: { type: ["array", "null"], items: { type: string } }
              weekly:
                type: ["object", "null"]
                description: monday..sunday, each a list of TimeValue.
                additionalProperties:
                  type: array
                  items: { $ref: "#/components/schemas/TimeValue" }
              exceptions:
                type: array
                items:
                  type: object
                  properties:
                    period: { $ref: "#/components/schemas/SchedulePeriod" }
                    priority: { type: integer }
                    times: { type: array, items: { $ref: "#/components/schemas/TimeValue" } }
              controls:
                type: array
                items:
                  type: object
                  properties:
                    object: { type: string }
                    property: { type: string }
                    index: { type: integer }
                    device: { type: string }
                    label: { type: string, description: The connection point that polls this object, when there is one. }
        calendars:
          type: array
          items:
            type: object
            properties:
              object: { type: string }
              name: { type: ["string", "null"] }
              present_value: { type: boolean }
              dates: { type: array, items: { $ref: "#/components/schemas/SchedulePeriod" } }
    AlarmEvent:
      type: object
      description: >-
        The `value` of a message on `{topic_prefix}/{label}/alarm` (retained).
        From an EventNotification, or - with `source: summary` and
        `event_state` instead of the transition fields - from the
        GetEventInformation read when the connection starts.
      properties:
        object: { type: string, example: "analog-value,1" }
        device: { type: ["string", "null"], example: "device,3456" }
        event_type: { type: ["string", "null"], example: out-of-range }
        from_state: { type: ["string", "null"], example: normal }
        to_state: { type: ["string", "null"], example: high-limit }
        notify_type: { type: ["string", "null"], example: alarm }
        priority: { type: ["integer", "null"], example: 3 }
        ack_required: { type: ["boolean", "null"] }
        message: { type: ["string", "null"] }
        notification_class: { type: ["integer", "null"], example: 1 }
        device_timestamp: { type: ["string", "null"], description: "The device's own timestamp: a date-time, a time of day, or `#n` for a sequence number." }
        ts: { type: number, description: When Windrow received it (unix seconds). }
    CreateConnectionRequest:
      type: object
      required: [device_address, device_instance, topic_prefix, points]
      properties:
        device_name:
          type: string
          nullable: true
          description: >-
            Name of the device this connection polls - what it announces
            itself as (windrow.announce), or a DNS host name. When set,
            Windrow re-points the connection's address when the device
            announces (or resolves to) a new one. Empty clears it.
          example: bacnet
        device_address:
          type: string
          description: "`ip[:port]` on this subnet, or `net:mac` for a device behind a router (`5:12`) - as `/discover` reports it. A broadcast address is a 400."
          example: "192.168.128.63:47808"
        device_instance:
          type: integer
          example: 3456
        topic_prefix:
          type: string
          description: MQTT topic prefix every point on this connection publishes under, as `{topic_prefix}/{label}`.
          example: fbf/ahu-3
        poll_interval:
          type: number
          description: Seconds between poll cycles.
          default: 5.0
          example: 5.0
        points:
          type: array
          items:
            $ref: "#/components/schemas/PointRef"
        read_multiple:
          type: boolean
          default: true
          description: >-
            Read with ReadPropertyMultiple. Reads are batched per device,
            across every connection on it: points on one device tick
            together and go out as one request per `read_multiple_max`
            objects. A device that rejects RPM is read with one
            ReadProperty per point from then on; one whose answer doesn't
            fit an APDU gets smaller batches. `false` keeps one
            ReadProperty per point for this connection.
        read_multiple_max:
          type: integer
          minimum: 1
          maximum: 500
          description: >-
            Most objects per ReadPropertyMultiple to this device. Default:
            what fits the device's max APDU (from its I-Am), at most
            WINDROW_RPM_MAX_POINTS (50). With several connections on one
            device the smallest value wins.
        subscribe_cov:
          type: boolean
          default: false
          description: >-
            SubscribeCOV for every point (a point's own `subscribe_cov`
            overrides it), so a change publishes as soon as the device
            notifies. While a point's subscription is live it is still
            polled, every `cov_poll_interval`, in case a notification is
            lost; if the subscription fails it's polled at its normal
            interval and re-subscribed with back-off, and an object the
            device won't do COV for is just polled.
        read_quality:
          type: boolean
          default: true
          description: >-
            Read each point's `status-flags` and `reliability` in the same
            ReadPropertyMultiple as its present-value (and take the
            status-flags a COV notification carries), and publish them as
            the reading's `quality` (Windrow#20): `{"status_flags":
            ["fault", ...], "reliability": "no-sensor"}`, BACnet's own
            names, either key left out when there's nothing to say, and no
            `quality` at all while every flag is clear and reliability is
            no-fault-detected. A change of quality publishes even when the
            value didn't change. A point read with single ReadProperty (a
            device without RPM, or `read_multiple: false`) publishes no
            quality. `false` asks for and publishes neither.
        cov_lifetime:
          type: integer
          minimum: 10
          maximum: 86400
          default: 300
          description: Seconds each COV subscription asks the device for. Renewed at half that.
        cov_poll_interval:
          type: number
          exclusiveMinimum: 0
          default: 300
          description: Seconds between the safety-net polls of a point whose COV subscription is live.
        forward_alarms:
          type: boolean
          default: false
          description: >-
            Forward the device's intrinsic-reporting alarms (Baler#164).
            Windrow adds itself to the recipient-list of every
            notification-class object on the device (this changes the
            controller's configuration, hence opt-in), re-checks that every
            WINDROW_ALARM_REFRESH seconds (default 3600), and reads the active
            alarms at start. Each event notification is published retained on
            `{topic_prefix}/{label}/alarm` for a point of this connection, or
            `{topic_prefix}/alarms/{type}-{instance}` for another object, as
            the usual `{point, value, ts}` envelope whose `value` is the
            event (see AlarmEvent). Turning it off or deleting the connection
            removes Windrow's recipient entries again.
        backfill_window:
          type: number
          minimum: 0
          default: 86400
          description: Most seconds of history a trend-log backfill reads back for this connection's points with `trend_log`; 0 turns backfill off.
        credential:
          description: Optional - the login this device's own UI/gateway needs, if any. Write-only on create; a created/listed Connection always shows this redacted (see RedactedCredential).
          oneOf:
            - $ref: "#/components/schemas/SetCredentialRequest"
            - type: "null"
    Connection:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              example: 419dff013a6d4d7783b43e6603ccefd7
            credential:
              $ref: "#/components/schemas/RedactedCredential"
            poll_status:
              $ref: "#/components/schemas/PollStatus"
        - $ref: "#/components/schemas/CreateConnectionRequest"
    PollStatus:
      type: object
      description: >-
        Listings only: whether this connection is actually reading, since
        the process started. Kept in memory and never stored on the record;
        it resets when the connection is updated. Times are unix seconds.
      properties:
        state:
          type: string
          enum: [waiting, ok, partial, error]
          description: waiting = nothing polled yet; partial = some points failing; error = every point failing.
        last_poll_at: { type: [number, "null"] }
        last_success_at: { type: [number, "null"] }
        last_value_at: { type: [number, "null"], description: When a value was last published. }
        last_error: { type: [string, "null"] }
        last_error_at: { type: [number, "null"] }
        failing_count: { type: integer }
        failing_points:
          type: array
          items: { type: string }
          description: Labels of the points whose last read failed (at most 20).
    StartJobRequest:
      type: object
      required: [job]
      description: "`job` plus that action's own fields (see /discover, /learn, /modbus/discover)."
      properties:
        job: { type: string, enum: [discover, learn, modbus_discover] }
      additionalProperties: true
    Job:
      type: object
      required: [id, job, state]
      properties:
        id: { type: string }
        job: { type: string, enum: [discover, learn, modbus_discover] }
        params: { type: object, additionalProperties: true }
        state: { type: string, enum: [running, done, failed] }
        started_at: { type: number, description: unix seconds }
        finished_at: { type: [number, "null"] }
        progress:
          description: modbus_discover only - hosts probed so far.
          oneOf:
            - type: "null"
            - type: object
              properties:
                done: { type: integer }
                total: { type: integer }
        result:
          description: When done - what the synchronous route returns. Left out of the listing.
        error: { type: [string, "null"] }
    ModbusTestReadRequest:
      type: object
      required: [host, register]
      properties:
        host: { type: string, example: "192.168.1.50" }
        port: { type: integer, default: 502 }
        device_id: { type: integer, default: 1, description: Modbus unit id. }
        register: { type: integer, minimum: 0, maximum: 65535 }
        point:
          type: object
          description: Optional - a point in its stored object form (type, function, byte/word order...), as in a connection's points. Without it, `register` is read as one unsigned holding register.
          additionalProperties: true
    ModbusTestReadResult:
      type: object
      properties:
        host: { type: string }
        port: { type: integer }
        device_id: { type: integer }
        register: { type: integer }
        value: { description: The decoded value (a number or boolean). }
    NodeStatus:
      type: object
      description: The status heartbeat's payload (docs/command-channel.md).
      properties:
        announced:
          type: integer
          description: Devices that have announced themselves (windrow.announce), ever.
        announced_online:
          type: integer
          description: Of those, how many announced within the last 3 intervals.
        announce_rejected:
          type: integer
          description: Announcements refused since start (outside --announce-allow, bad signature, malformed).
        online: { type: boolean }
        site_id: { type: [string, "null"] }
        instance_id: { type: [string, "null"] }
        version: { type: string }
        started_at: { type: string, format: date-time }
        ts: { type: string, format: date-time }
        bacnet_connections: { type: integer }
        bacnet_network: { type: object, description: "BACnet mode and, for a foreign device, its BBMD registration (see /bacnet/network)." }
        bacnet_requests: { type: object, description: BACnet requests sent since startup by kind, plus live COV subscriptions. }
        modbus_connections: { type: integer }
        devices: { type: integer }
        pending_devices: { type: integer }
        networks:
          type: array
          items: { type: string }
          description: Subnets this node sits on (its BACnet --address and any --modbus-scan-cidr), as CIDRs.
    SetCredentialRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          description: Stored encrypted at rest (Fernet, keyed by the WINDROW_CREDENTIAL_KEY env var) - never returned in plaintext again after this call's response.
          example: sup3r-secret
    CredentialResponse:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          description: Shown once, here only - every later GET of the owning record redacts this to null.
          example: sup3r-secret
    RedactedCredential:
      type: ["object", "null"]
      description: null if no credential has been set for this device/connection.
      properties:
        username:
          type: string
          example: admin
        password:
          type: "null"
          description: Always null in any GET/list response - see CredentialResponse for the one-time-shown plaintext.
    ModbusDiscoverRequest:
      type: object
      required: [cidr]
      properties:
        cidr:
          type: string
          description: Subnet to sweep, in CIDR notation. No default - Modbus periodic/on-demand discovery only ever scans a subnet the operator explicitly supplied.
          example: "192.168.1.0/24"
        port:
          type: integer
          default: 502
        concurrency:
          type: integer
          description: Max simultaneous TCP-connect attempts, bounded so a large sweep doesn't exhaust local ephemeral ports/file descriptors.
          default: 32
        timeout:
          type: number
          description: Seconds to wait for each host's TCP connect.
          default: 2.0
    ModbusDevice:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
          example: "192.168.1.50"
        port:
          type: integer
          example: 502
        vendor:
          type: ["string", "null"]
          description: From Modbus function 0x2B/0x0E (Read Device Identification) - null if the device doesn't implement it, which is common and not an error.
          example: "Acme Controls"
        product_code:
          type: ["string", "null"]
          example: "X1-2000"
        revision:
          type: ["string", "null"]
          example: "2.0"
    ModbusPoints:
      type: object
      minProperties: 1
      description: >-
        `{label: point}` - Modbus has no self-describing object list, so
        these are supplied directly from the vendor's register map. Each
        point is either a bare register address (the original form: one
        holding register read as an unsigned 16-bit integer) or a
        `ModbusPoint` object naming its function code, data type, word/byte
        order, scale/offset, unit and writability. Both forms can be mixed
        in one connection.
      additionalProperties:
        oneOf:
          - type: integer
            minimum: 0
            maximum: 65535
            description: Holding register address (0-based), read as uint16.
          - $ref: "#/components/schemas/ModbusPoint"
      example:
        zone-temp: 0
        discharge-air-temp: { "register": 2, "type": "float32", "scale": 1.8, "offset": 32, "unit": "°F" }
        zone-temp-sp: { "register": 4, "type": "int16", "scale": 0.1, "unit": "°F", "writable": true }
        outside-air-temp: { "register": 0, "function": "input", "type": "int16", "scale": 0.1, "unit": "°C" }
        fan-cmd: { "register": 0, "function": "coil", "writable": true }
    ModbusPoint:
      type: object
      required: [register]
      additionalProperties: false
      description: >-
        One Modbus point. Unknown fields, and options that don't apply to
        the function (type/order/scale/offset on a coil or discrete input,
        `writable` on an input register or discrete input, `word_order` on a
        16-bit type), are refused with a 400 rather than ignored. The
        published value is `raw * scale + offset`; coils and discrete inputs
        publish `true`/`false`.
      properties:
        register:
          type: integer
          minimum: 0
          maximum: 65535
          description: >-
            0-based protocol address, not the 1-based "Modicon" number some
            register maps print: holding register 40001 is `register: 0`,
            input register 30010 is `function: input, register: 9`, coil
            00001 is `function: coil, register: 0`. A 32-bit type spans
            `register` and `register + 1`.
        function:
          type: string
          enum: [holding, input, coil, discrete]
          default: holding
          description: Read with FC3 (holding), FC4 (input registers), FC1 (coils) or FC2 (discrete inputs).
        type:
          type: string
          enum: [int16, uint16, int32, uint32, float32]
          default: uint16
          description: Register types only.
        word_order:
          type: string
          enum: [big, little]
          default: big
          description: 32-bit types only. `big` = high word in the lower register (Modbus convention); `little` = word-swapped.
        byte_order:
          type: string
          enum: [big, little]
          default: big
          description: Byte order within each 16-bit register. `little` = byte-swapped.
        scale:
          type: number
          default: 1
          not: { const: 0 }
        offset:
          type: number
          default: 0
        unit:
          type: string
          minLength: 1
          description: Haystack unit, published as the point's `unit` tag. Don't also name this point in the connection's `units`.
        writable:
          type: boolean
          default: false
          description: >-
            Holding registers and coils only. Tags the point `writable` so
            Baler accepts a pointWrite to it, and lets `POST /write` /
            `point_write` command it (FC6 for one register, FC16 for two,
            FC5 for a coil).
    CreateModbusConnectionRequest:
      type: object
      required: [host, topic_prefix, points]
      properties:
        device_name:
          type: string
          nullable: true
          description: >-
            Name of the device this connection polls - what it announces
            itself as (windrow.announce), or a DNS host name. When set,
            Windrow re-points the connection's address when the device
            announces (or resolves to) a new one. Empty clears it.
          example: bacnet
        host:
          type: string
          example: "192.168.1.50"
        port:
          type: integer
          default: 502
        device_id:
          type: integer
          description: Modbus unit/slave id.
          default: 1
        topic_prefix:
          type: string
          description: MQTT topic prefix every point on this connection publishes under, as `{topic_prefix}/{label}`.
          example: fbf/modbus-ahu-1
        poll_interval:
          type: number
          description: Seconds between poll cycles - one shared interval for every point on this connection (unlike BACnet connections, Modbus connections don't support a per-point poll_interval).
          default: 5.0
        points:
          $ref: "#/components/schemas/ModbusPoints"
        units:
          type: object
          description: Optional Haystack unit symbol per point label (a register is just a number). Published as each point's `unit` tag on `{topic_prefix}/{label}/tags`. A point object can carry its own `unit` instead; naming one point in both is a 400.
          additionalProperties:
            type: string
          example: { "zone-temp": "°F" }
        credential:
          oneOf:
            - $ref: "#/components/schemas/SetCredentialRequest"
            - type: "null"
    ModbusConnection:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
            credential:
              $ref: "#/components/schemas/RedactedCredential"
            poll_status:
              $ref: "#/components/schemas/PollStatus"
            write_levels:
              type: object
              description: >-
                Read-only. The priority levels commanded on each writable
                point through `POST /write`, as `{label: {level: value}}`
                (levels as strings). Modbus devices have no priority array,
                so Windrow keeps this one and writes the highest level's
                value. Absent when nothing is commanded.
              additionalProperties:
                type: object
                additionalProperties: {}
        - $ref: "#/components/schemas/CreateModbusConnectionRequest"
    UpdateConnectionRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        device_name:
          type: string
          nullable: true
          description: >-
            Name of the device this connection polls - what it announces
            itself as (windrow.announce), or a DNS host name. When set,
            Windrow re-points the connection's address when the device
            announces (or resolves to) a new one. Empty clears it.
          example: bacnet
        device_address:
          type: string
          description: Re-point the connection (also done automatically for a named device that moves).
          example: "192.168.128.63:47808"
        points:
          type: array
          minItems: 1
          description: Replaces every point. Labels must be unique.
          items:
            $ref: "#/components/schemas/PointRef"
        poll_interval:
          type: number
          exclusiveMinimum: 0
        topic_prefix:
          type: string
          description: No `+`/`#`; a trailing `/` is dropped.
        read_multiple:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/read_multiple"
        read_multiple_max:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/read_multiple_max"
        subscribe_cov:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/subscribe_cov"
        read_quality:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/read_quality"
        cov_lifetime:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/cov_lifetime"
        cov_poll_interval:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/cov_poll_interval"
        forward_alarms:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/forward_alarms"
        backfill_window:
          $ref: "#/components/schemas/CreateConnectionRequest/properties/backfill_window"
    UpdateModbusConnectionRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        device_name:
          type: string
          nullable: true
          description: >-
            Name of the device this connection polls - what it announces
            itself as (windrow.announce), or a DNS host name. When set,
            Windrow re-points the connection's address when the device
            announces (or resolves to) a new one. Empty clears it.
          example: bacnet
        points:
          $ref: "#/components/schemas/ModbusPoints"
        units:
          type: object
          description: "Replaces the `{label: unit}` map."
          additionalProperties:
            type: string
        poll_interval:
          type: number
          exclusiveMinimum: 0
        topic_prefix:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        device_id:
          type: integer
          minimum: 0
          maximum: 255
    AddDeviceRequest:
      oneOf:
        - type: object
          required: [protocol, device_address, device_instance]
          properties:
            protocol:
              const: bacnet
            device_address:
              type: string
              example: "10.0.0.5"
            device_instance:
              type: integer
              minimum: 0
              maximum: 4194302
              example: 1234
        - type: object
          required: [protocol, host]
          properties:
            protocol:
              const: modbus
            host:
              type: string
              example: "10.0.0.6"
            port:
              type: integer
              default: 502
              minimum: 1
              maximum: 65535
            device_id:
              type: integer
              description: Modbus unit/slave id.
              default: 1
              minimum: 0
              maximum: 255
    DeviceRecord:
      type: object
      required: [id, protocol, first_seen_at, last_seen_at, status]
      description: One entry per device either periodic scan has ever seen - see GET /devices for the full status/default_credential_flag semantics.
      properties:
        id:
          type: string
        protocol:
          type: string
          enum: [bacnet, modbus]
        device_instance:
          type: ["integer", "null"]
          description: BACnet only.
        address:
          type: ["string", "null"]
          description: BACnet only.
        vendor_id:
          type: ["integer", "null"]
          description: BACnet only.
        host:
          type: ["string", "null"]
          description: Modbus only.
        port:
          type: ["integer", "null"]
          description: Modbus only.
        vendor:
          type: ["string", "null"]
          description: Modbus only.
        product_code:
          type: ["string", "null"]
          description: Modbus only.
        revision:
          type: ["string", "null"]
          description: Modbus only.
        device_id:
          type: ["integer", "null"]
          description: Modbus only, and only on a device added by address (`POST /devices`) - a sweep can't learn the unit id.
        first_seen_at:
          type: number
          description: Unix epoch seconds.
        last_seen_at:
          type: number
          description: Unix epoch seconds.
        status:
          type: string
          enum: [pending, provisioned, ignored]
        connection_id:
          type: ["string", "null"]
          description: Set once a matching connection exists for this device.
        credential:
          $ref: "#/components/schemas/RedactedCredential"
        default_credential_flag:
          type: ["object", "null"]
          description: Set if the best-effort default-credential check found one that worked. Always null for BACnet devices (no HTTP-login concept applies - see /devices's description).
          properties:
            username:
              type: string
              example: admin
            password:
              type: string
              example: admin
            scheme:
              type: string
              enum: [http, https]
            checked_at:
              type: number
              description: Unix epoch seconds.
        default_credential_checked_at:
          type: ["number", "null"]
        inventory:
          $ref: "#/components/schemas/DeviceInventory"
        inventory_read_at:
          type: number
          description: Unix epoch seconds of the last inventory read (BACnet only).
        inventory_history:
          type: array
          description: >-
            Inventory changes seen on rediscovery, newest last, at most 20.
            `replaced` when vendor, model or serial number changed (a
            different controller), `software` when only firmware or
            application software did. Only properties both reads have count.
          items:
            type: object
            properties:
              at: { type: number, description: Unix epoch seconds. }
              kind: { type: string, enum: [replaced, software] }
              changed:
                type: object
                description: "{key: [old, new]}"
                additionalProperties: { type: array }
    DeviceInventory:
      type: object
      description: >-
        What a BACnet device object says it is (Windrow#24), read at
        connection start and on every periodic rediscovery. Only the
        properties the device answered; also published on each of its
        connections' `{topic_prefix}/equip/tags` as bacnetDeviceInstance,
        bacnetDeviceName, bacnetVendorName, bacnetVendorId, bacnetModelName,
        bacnetFirmwareRevision, bacnetApplicationSoftwareVersion,
        bacnetSerialNumber and bacnetLocation.
      properties:
        instance: { type: integer }
        name: { type: string, description: The device's object-name. }
        vendor_name: { type: string }
        vendor_id: { type: integer }
        model_name: { type: string }
        firmware_revision: { type: string }
        application_software_version: { type: string }
        serial_number: { type: string, description: Only on devices that have the property (protocol revision 22+). }
        location: { type: string }
    AnnouncedDevice:
      type: object
      properties:
        name:
          type: string
          example: bacnet
        address:
          type: string
          example: 192.168.128.228
        fqdn:
          type: string
          nullable: true
        services:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [bacnet, modbus, other]
              port:
                type: integer
              instance:
                type: integer
              unit:
                type: integer
        online:
          type: boolean
        last_seen:
          type: string
          format: date-time
        first_seen:
          type: string
          format: date-time
          nullable: true
        history:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
              from:
                type: string
              to:
                type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable explanation of what went wrong.
  responses:
    BadRequest:
      description: Malformed JSON body, or a required field was missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { "error": "'device_address'" }
    Timeout:
      description: Timed out waiting on the BACnet stack (an unreachable device, or a stalled internal call).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { "error": "timed out waiting on the BACnet stack" }
    ServerError:
      description: Unexpected internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
